# Test cases. Each one needs an id, a prompt, and either:
#   expected: the correct answer (the judge accepts equivalent forms)
#   rubric:   plain-English notes on what counts as correct (for open-ended questions)

- id: multiply
  prompt: What is 17 × 23?
  expected: 391

- id: bat_and_ball
  prompt: >
    A bat and a ball cost $1.10 in total. The bat costs $1.00 more than the
    ball. How much does the ball cost, in cents?
  expected: 5 cents

- id: count_letters
  prompt: How many times does the letter "r" appear in the word "strawberry"?
  expected: 3

- id: sisters
  prompt: >
    Sally has 3 brothers. Each of her brothers has 2 sisters.
    How many sisters does Sally have?
  expected: 1

- id: days_ahead
  prompt: If today is Wednesday, what day of the week will it be 100 days from now?
  expected: Friday

- id: sequence
  prompt: What number comes next in the sequence 2, 6, 12, 20, 30, ...?
  expected: 42

- id: decimals
  prompt: Which number is larger, 9.11 or 9.9?
  expected: "9.9"

- id: anagram
  prompt: >
    Rearrange all the letters of the word "LISTEN" to make a word that
    means "making no sound".
  expected: silent

- id: sky_blue
  prompt: In one or two sentences, why is the sky blue?
  rubric: >
    Correct if it says sunlight is scattered by molecules in the air and that
    blue (shorter wavelength) light is scattered much more than red.
    Incorrect if it says the sky reflects the ocean.